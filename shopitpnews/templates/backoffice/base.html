<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}پنل مدیریت{% endblock %} | جوجه بازار</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>body{font-family:'Vazirmatn',sans-serif;background:#f7fbf0}</style>
</head>
<body class="bg-[#f7fbf0] text-[#181d17] min-h-screen">
<header class="sticky top-0 z-50 bg-[#f1f5eb] shadow px-4 py-3">
  <div class="max-w-6xl mx-auto flex flex-wrap gap-3 items-center justify-between">
    <a href="{% url 'dashboard' %}" class="font-bold text-[#0d631b]">جوجه بازار</a>
    <nav class="flex gap-3 text-sm">
      <a class="text-[#0d631b]" href="{% url 'backoffice:overview' %}">داشبورد مدیر</a>
      <a class="text-[#0d631b]" href="{% url 'backoffice:market_prices' %}">قیمت روز</a>
      <a class="text-[#0d631b]" href="{% url 'backoffice:users' %}">کاربران</a>
      <a class="text-[#0d631b]" href="{% url 'backoffice:disputes' %}">اختلافات</a>
    </nav>
  </div>
</header>
<main class="max-w-6xl mx-auto p-4 space-y-5">
  {% for message in messages %}<p class="rounded-xl p-3 {% if message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800{% else %}bg-green-100 text-green-800{% endif %}">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
