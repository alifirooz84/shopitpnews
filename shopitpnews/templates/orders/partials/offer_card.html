<article class="rounded-2xl bg-white p-5 shadow"><div class="flex flex-col md:flex-row md:items-start justify-between gap-3"><div><span class="rounded-full bg-[#f7fbf0] px-3 py-1 text-xs">{{ role_label }}</span><h3 class="font-bold text-xl mt-2">{{ offer.listing.title }}</h3><p class="text-sm text-gray-600">{{ offer.quantity }} قطعه × {{ offer.proposed_unit_price }} تومان | {{ offer.get_status_display }}</p><p class="text-sm text-gray-500">خریدار: {{ offer.buyer }} | فروشنده: {{ offer.listing.seller }}</p></div><div class="md:text-left"><strong class="block text-[#0d631b] text-xl">{{ offer.total_amount }} تومان</strong><a class="mt-3 block rounded-xl bg-[#0d631b] px-5 py-2 text-center text-white" href="{{ offer.get_absolute_url }}">جزئیات</a></div></div></article>
